server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads are whole PDFs; audio responses are whole audiobooks.
    client_max_body_size 512M;

    # Docker's embedded DNS. Resolving the API at request time (via the
    # variable below) means this container still serves the app when the API
    # is restarting, instead of refusing to start because the name is missing.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range requests must reach the API untouched so seeking works.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        # Fail fast when the API is down, but never cut off a long audio read.
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3600s;
    }

    # Client-side routes (/d/12) fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
